<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Radar{% endblock %} · Tamil.de</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#B01E2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">tamil<span>.de</span> <small>Radar</small></a>
  {% if session.user %}
  <nav>
    <a href="/" class="{{ 'aktiv' if request.endpoint == 'ui.feed' }}">Feed</a>
    <a href="/dashboard" class="{{ 'aktiv' if request.endpoint == 'ui.dashboard' }}">Dashboard</a>
    <a href="/protokoll" class="{{ 'aktiv' if request.endpoint == 'ui.protokoll' }}">Protokoll</a>
    <form method="post" action="/logout" class="inline"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button class="leise">Abmelden</button></form>
  </nav>
  {% endif %}
</header>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}<div class="meldungen">{% for cat, m in messages %}<div class="meldung {{ cat }}">{{ m|urlize(target='_blank') }}</div>{% endfor %}</div>{% endif %}
{% endwith %}
<main>{% block content %}{% endblock %}</main>
<script src="/static/app.js"></script>
</body>
</html>
