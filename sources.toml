# News-Radar Konfiguration – DACH-Radar für die tamilische Community
#
# Quellentypen:
#   rss           RSS/Atom-Feed, kein Token
#   gnews_region  Google-News-RSS, automatisch je Stadt/Land aus [regions] (rotierend, ~6 Abfragen je Lauf)
#   wp_json       WordPress-REST (/wp-json/wp/v2/<endpoint>)
#   html          HTML-Seite mit CSS-Selektoren
#   kino          Kinoprogramm-API (provider = cinestar | kinoheld | cineplexx)
#   newsapi/gnews Token-APIs (NEWSAPI_KEY / GNEWS_TOKEN)
#
# Je Quelle: kind = news|event|kino, country = DE|CH|AT, min_score (0 = vertrauenswürdig, immer prüfen),
# max_items je Lauf, interval_minutes (0 = jeder Lauf).

# ---- Presse DACH über Google News (rotierend) ----
[[source]]
name = "Google News DACH"
type = "gnews_region"
query = "(Tamil OR tamilisch OR Tamilen)"
params = { when = "2d", max_queries = 32, per_run = 6 }

[[source]]
name = "Google News · Tempel & Kino"
type = "rss"
url = "https://news.google.com/rss/search?q=(Sri-Kamadchi-Ampal+OR+%22Hindu+Tempelfest%22+OR+%22tamilischer+Film%22+OR+Kollywood)+when:3d&hl=de&gl=DE&ceid=DE:de"

[[source]]
name = "Google News CH · Tamilen"
type = "rss"
url = "https://news.google.com/rss/search?q=(Tamilen+OR+tamilisch)+when:3d&hl=de&gl=CH&ceid=CH:de"
country = "CH"

[[source]]
name = "Google News AT · Sri Lanka"
type = "rss"
url = "https://news.google.com/rss/search?q=(Tamilen+OR+tamilisch+OR+%22Sri+Lanka%22)+when:3d&hl=de&gl=AT&ceid=AT:de"
country = "AT"

