# ---- Token-APIs (optional) ----
[[source]]
name = "NewsAPI · Tamil DACH"
type = "newsapi"
query = "(tamil OR tamilen OR tamilisch OR \"sri lanka\") AND (deutschland OR schweiz OR österreich OR diaspora OR kino)"
language = "de"
max_items = 3

[[source]]
name = "GNews · Tamil"
type = "gnews"
query = "Tamilen OR tamilisch OR \"Tamil Germany\" OR \"Tamil Switzerland\""
language = "de"
max_items = 3

# ---- Regionen: DACH-Bezug und Orte (Reihenfolge = Priorität für Google-News-Abfragen) ----
[regions.staedte]
de = ["Berlin", "Hamburg", "Köln", "Düsseldorf", "Dortmund", "Essen", "Frankfurt", "Stuttgart", "München", "Nürnberg", "Hannover", "Bielefeld", "Paderborn", "Hamm", "Bremen", "Leipzig", "Dresden", "Gummersbach"]
ch = ["Zürich", "Bern", "Basel", "Luzern", "St. Gallen", "Winterthur", "Aargau"]
at = ["Wien", "Graz", "Linz", "Salzburg"]

[regions.laender]
de = ["Deutschland", "Germany", "NRW", "Nordrhein-Westfalen", "Hessen", "Bayern", "Baden-Württemberg", "ஜெர்மனி"]
ch = ["Schweiz", "Switzerland", "Swiss", "சுவிஸ்", "சுவிட்சர்லாந்து"]
at = ["Österreich", "Austria", "ஆஸ்திரியா"]

[regions.aliases]
"Köln" = ["Cologne", "கொலோன்"]
"Zürich" = ["Zurich", "Zuerich", "சூரிச்"]
"München" = ["Munich", "Muenchen"]
"Wien" = ["Vienna", "வியன்னா"]
"Düsseldorf" = ["Duesseldorf"]
"Nürnberg" = ["Nuremberg", "Nuernberg"]
"Basel" = ["பாசல்"]
"Bern" = ["பேர்ன்"]
