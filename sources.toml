"யாழ்ப்பாணம்" = 3
"சுவிஸ்" = 3
"ஜெர்மனி" = 3

# Ausschluss: Meldungen mit diesen Begriffen werden verworfen
[blocklist]
terms = ["horoskop", "casino", "betting", "wetten", "porn", "obituary", "todesanzeige", "sponsored", "anzeige:"]
# Termine (kind = event) mit diesen Begriffen werden nie automatisch zur Story: Gedenken mit LTTE-Bezug
termine = ["maaveerar", "maveerar", "mahaveerar", "mahaaveerar", "mavirar", "மாவீரர்", "heroes day", "national heroes",
           "heldengedenktag", "heldentag"]  # verglichen ohne Apostrophe und Diakritika

# Ziel-Kategorien (Slug in WordPress) + Stichwörter für die Zuordnung. Die KI wählt final eine davon.
[categories.news]
label = "Nachrichten"
hints = ["sri lanka", "tamil nadu", "politik", "regierung", "wahl", "jaffna", "chennai", "gericht", "protest"]

[categories.community]
label = "Community"
hints = ["diaspora", "verein", "tempel", "schule", "gemeinde", "integration", "tamilschule"]

[categories.entertainment]
label = "Entertainment"
hints = ["anirudh", "a.r. rahman", "song", "album", "konzert", "concert", "star", "serie", "musik"]

[categories.kino]
label = "Kino"
hints = ["kollywood", "film", "kino", "cinema", "cineplex", "cinemaxx", "cinestar", "trailer", "box office", "premiere", "rajinikanth", "vijay", "suriya", "ajith"]

[categories.events]
label = "Events"
hints = ["festival", "event", "tickets", "tour", "live in", "veranstaltung", "fest", "night"]

[categories.kueche]
label = "Küche"
hints = ["rezept", "recipe", "küche", "food", "restaurant", "biryani", "dosa", "kottu"]

[categories.sport]
label = "Sport"
hints = ["cricket", "sport", "fußball", "football", "olympia", "turnier", "liga"]

[categories.kultur]
label = "Kultur"
hints = ["pongal", "deepavali", "diwali", "thaipusam", "bharatanatyam", "sprache", "literatur", "kultur", "tradition", "murugan"]

# Bildquellen: Seiten, deren eigenes Bildmaterial tamil.de mit Bildnachweis redaktionell verwenden darf.
# Entscheidung vom 11.11.2026 (docs/entscheidungen.md): Material von Veranstaltern, Tempeln, Vereinen, Festivals,
# Kinos (Plakate und Filmbilder vom Verleih) und Betrieben, über die berichtet wird. Keine Nachrichtenmedien, keine
# Agenturen, keine sozialen Netzwerke, keine Behörden. Der Nachweis wird wörtlich übernommen.
# Das Bild muss unter dem eingetragenen Host liegen (Subdomains zählen). Liegt das eigene Bildmaterial einer Quelle auf
# einem eigenen CDN, wird dessen Host im Eintrag als bild_hosts = ["cdn.beispiel.ch"] ergänzt (vorerst bei keinem Eintrag).
# Hosts sozialer Netzwerke und Bildagenturen sind fest gesperrt und dürfen hier nicht stehen.

