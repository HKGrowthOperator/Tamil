de = ["Berlin", "Hamburg", "Köln", "Düsseldorf", "Dortmund", "Essen", "Frankfurt", "Stuttgart", "München", "Nürnberg", "Hannover", "Bielefeld", "Paderborn", "Hamm", "Bremen", "Leipzig", "Dresden", "Gummersbach"]
ch = ["Zürich", "Bern", "Basel", "Luzern", "St. Gallen", "Winterthur", "Aargau"]
at = ["Wien", "Graz", "Linz", "Salzburg"]

[regions.laender]
de = ["Deutschland", "Germany", "NRW", "Nordrhein-Westfalen", "Hessen", "Bayern", "Baden-Württemberg", "ஜெர்மனி"]
# „சுவிட்சர்லாந்த“ = Stamm für சுவிட்சர்லாந்தில்/-தை/-தின் (die Grundform endet auf -து und trifft die Beugungen nicht)
ch = ["Schweiz", "Switzerland", "Swiss", "சுவிஸ்", "சுவிட்சர்லாந்து", "சுவிட்சர்லாந்த"]
at = ["Österreich", "Austria", "ஆஸ்திரியா"]

[regions.aliases]
"Köln" = ["Cologne", "கொலோன்"]
"Zürich" = ["Zurich", "Zuerich", "சூரிச்"]
"München" = ["Munich", "Muenchen"]
"Wien" = ["Vienna", "வியன்னா"]
"Düsseldorf" = ["Duesseldorf"]
"Nürnberg" = ["Nuremberg", "Nuernberg"]
"Basel" = ["பாசல்"]
"Bern" = ["பேர்ன்"]
"Frankfurt" = ["Frankfurt am Main"]

[regions]
exakt = ["Essen", "Hamm", "Bern", "Linz"]
# Orte außerhalb von DACH: Nennt eine Meldung einen davon und keinen DACH-Ort, gilt das Land der Quelle nicht als
# DACH-Bezug, und Termine fallen ganz heraus (z. B. Swiss Tamil Info über ein Fest in Markham, Kanada).
ausland = ["Kanada", "Canada", "Canadian", "கனடா", "கனடிய", "Toronto", "டொரண்டோ", "ரொறன்ரோ", "Markham", "மார்க்கம்",
           "Scarborough", "Montreal", "London", "லண்டன்", "England", "Frankreich", "France", "Paris", "பாரிஸ்",
           "Norwegen", "Norway", "Oslo", "Dänemark", "Denmark", "Niederlande", "Netherlands", "Australien",
           "Australia", "Sydney", "Melbourne", "Malaysia", "Singapur", "Singapore", "USA", "Jaffna", "யாழ்ப்பாணம்",
           "Chennai", "சென்னை", "Colombo", "கொழும்பு",
           # Orte in Sri Lanka (Fund 09.11.: alte Berichte aus Kilinochchi, Jaffna, Kataragama als „Termin“).
           # Tamil-Schrift trifft als Teilstring: „யாழ்“ ohne Punkt träfe auch யாழினி (Vorname) und யாழிசை –
           # deshalb nur die Kurzform mit Punkt („யாழ். பல்கலை“).
           # Keine Länder- oder Volksnamen (Sri Lanka, இலங்கை, Indien, Tamil Nadu): Sie stehen in fast jedem Bericht
           # der Diaspora und würden echte Schweizer Termine ohne bekannte Stadt still herauswerfen.
           "Kilinochchi", "கிளிநொச்சி", "யாழ்.", "Kataragama", "கதிர்காமம்", "Mullaitivu", "முல்லைத்தீவு",
           "Batticaloa", "மட்டக்களப்பு", "Trincomalee", "திருகோணமலை", "Vavuniya", "வவுனியா", "Mannar", "மன்னார்"]

# ---- Bezug zur tamilischen Community (Quellen mit bezug_noetig = true) ----
# Mindestens einer dieser Begriffe muss in Titel oder Text stehen. Keine Ortsnamen: „சுவிஸ்“, „Zürich“ oder
# „Sri Lanka“ allein machen eine Schweizer Meldung nicht tamilisch. Lateinisch als ganzes Wort (+2 Buchstaben),
# Tamil-Schrift als Teilstring (தமிழ் trifft தமிழர்கள்).
[bezug]
terms = ["tamil", "tamilisch", "tamilen", "tamilin", "eelam", "kollywood", "rajinikanth", "anirudh", "a.r. rahman",
         "ilaiyaraaja", "pongal", "deepavali", "diwali", "thaipusam", "navaratri", "bharatanatyam", "kamadchi",
         "murugan", "hindu", "தமிழ்", "ஈழ", "இந்து", "கோவில்", "கோயில்", "அம்மன்", "முருகன்", "பொங்கல்",
         "தீபாவளி", "நவராத்திரி", "தைப்பூசம்", "பரதநாட்டியம்", "அரங்கேற்றம்"]

# ---- Stichwort-Gewichte (klein geschrieben; Treffer im Titel zählen doppelt) ----
