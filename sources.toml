# Ausschluss: Meldungen mit diesen Begriffen werden verworfen
[blocklist]
terms = ["horoskop", "casino", "betting", "wetten", "porn", "obituary", "todesanzeige", "sponsored", "anzeige:"]

# Ziel-Kategorien (Slug in WordPress) + Stichwörter für die Zuordnung.
# Die KI wählt final eine dieser Kategorien.
[categories.news]
label = "Nachrichten"
hints = ["sri lanka", "tamil nadu", "politik", "regierung", "wahl", "jaffna", "chennai"]

[categories.community]
label = "Community"
hints = ["diaspora", "verein", "deutschland", "germany", "tempel", "schule"]

[categories.entertainment]
label = "Entertainment"
hints = ["anirudh", "a.r. rahman", "song", "album", "konzert", "concert", "star", "serie"]

[categories.kino]
label = "Kino"
hints = ["kollywood", "film", "kino", "cinema", "cineplex", "cinemaxx", "trailer", "box office", "premiere", "rajinikanth", "vijay", "suriya", "ajith"]

[categories.events]
label = "Events"
hints = ["festival", "event", "tickets", "tour", "live in"]

[categories.kueche]
