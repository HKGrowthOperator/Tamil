# News-Radar Konfiguration – DACH-Radar für die tamilische Community
#
# Quellentypen:
#   rss           RSS/Atom-Feed, kein Token
#   gnews_region  Google-News-RSS, automatisch je Stadt/Land aus [regions] (rotierend, ~6 Abfragen je Lauf)
#   wp_json       WordPress-REST (/wp-json/wp/v2/<endpoint>)
#   html          HTML-Seite mit CSS-Selektoren
#   kino          Kinoprogramm-API (provider = cinestar | kinoheld | cineplexx)
#   newsapi/gnews Token-APIs (NEWSAPI_KEY / GNEWS_TOKEN)
#
# Je Quelle: kind = news|event|kino, country = DE|CH|AT, min_score (0 = vertrauenswürdig, immer prüfen),
# max_items je Lauf, interval_minutes (0 = jeder Lauf).
#
# Register (Blueprint 19.10.): enabled (false = abgeschaltet, bleibt im Register), prioritaet A/B/C, betreiber,
# robots (Ergebnis von `quellen pruefen`), paywall, bild_nutzen (Pressebilder nur mit dokumentierter Erlaubnis),
# vertrag, rechtlich_geprueft (Datum), notiz. Auswahl 20 von 28 am 08.11.2026 nach `quellen pruefen`; 11.11.2026
# elf Quellen aus der Quellen-Inventur dazu (Tempel, Vereine, Kinoreihen, Lokalpresse, SEM) → 27 von 39 aktiv (die vier Kino-Seiten zurückgestellt).

