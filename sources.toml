# ---- Events DACH ----
[[source]]
name = "Haus der Religionen Bern"
type = "wp_json"
url = "https://www.haus-der-religionen.ch"
endpoint = "mec-events"
params = { search = "Saivanerikoodam", per_page = 10, _fields = "id,date_gmt,link,title,excerpt" }
kind = "event"
country = "CH"
min_score = 0
max_items = 2
interval_minutes = 120

[[source]]
name = "Eventfrog CH"
type = "html"
url = "https://eventfrog.ch/de/events.html?searchTerm=tamil"
kind = "event"
country = "CH"
min_score = 1  # Suche ist unscharf: nur Treffer mit tamilischem Stichwort
max_items = 3
interval_minutes = 120
selectors = { item = "a.event-list__events__tile", title = ".event-list__events__tile__content__infos__title", link = "::attr(href)", date = ".event-list__events__tile__content__infos__time", ort = ".event-list__events__tile__content__infos__location" }

[[source]]
name = "Eventfrog DE"
type = "html"
url = "https://eventfrog.de/de/events.html?searchTerm=tamil"
kind = "event"
country = "DE"
min_score = 1
max_items = 3
interval_minutes = 120
selectors = { item = "a.event-list__events__tile", title = ".event-list__events__tile__content__infos__title", link = "::attr(href)", date = ".event-list__events__tile__content__infos__time", ort = ".event-list__events__tile__content__infos__location" }

[[source]]
name = "tamilswiss.ch Events"
type = "html"
url = "https://tamilswiss.ch/events"
kind = "event"
country = "CH"
min_score = 0
max_items = 2
interval_minutes = 180
selectors = { item = "[onclick*='openEventDetailsModal']" }
params = { json_pattern = 'openEventDetailsModal\((\{.*?\})\)', json_attr = "onclick", json_fields = { title = "title", url = "url", date = "date", ort = "city", summary = ["category", "location_name", "date", "time"] } }

[[source]]
name = "Hindu-Tempel Hamm"
type = "html"
url = "https://www.hinduistische-gemeinde-deutschland.de/aktuelles/"
kind = "event"
country = "DE"
min_score = 0
max_items = 2
interval_minutes = 360
selectors = { item = "article, .entry, .post", title = "h2, h3, .entry-title", link = "a::attr(href)", date = "time, .date" }

