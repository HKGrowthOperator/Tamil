# News-Radar Konfiguration (Vertrag Pos. B.1.5: bis zu zehn Quellen)
#
# type = "rss"     -> beliebiger RSS/Atom-Feed, kein Token nötig
# type = "newsapi" -> newsapi.org, Token aus NEWSAPI_KEY
# type = "gnews"   -> gnews.io, Token aus GNEWS_TOKEN

[[source]]
name = "Google News DE · Tamil"
type = "rss"
url = "https://news.google.com/rss/search?q=tamil+OR+tamilisch+OR+tamilen&hl=de&gl=DE&ceid=DE:de"

[[source]]
name = "Google News DE · Sri Lanka"
type = "rss"
url = "https://news.google.com/rss/search?q=%22Sri+Lanka%22&hl=de&gl=DE&ceid=DE:de"

[[source]]
name = "Google News EN · Kollywood"
type = "rss"
url = "https://news.google.com/rss/search?q=kollywood+OR+%22tamil+film%22+OR+%22tamil+cinema%22&hl=en-IN&gl=IN&ceid=IN:en"

[[source]]
name = "The Hindu · Tamil Nadu"
type = "rss"
url = "https://www.thehindu.com/news/national/tamil-nadu/feeder/default.rss"

[[source]]
name = "Daily Mirror Sri Lanka"
type = "rss"
url = "https://www.dailymirror.lk/rss/breaking-news/108"

[[source]]
name = "NewsAPI · Tamil Diaspora"
type = "newsapi"
query = "(tamil OR tamilen OR tamilisch OR \"sri lanka\" OR kollywood) AND (deutschland OR germany OR europa OR diaspora OR film OR kino)"
language = "de"

[[source]]
name = "NewsAPI · Kollywood EN"
type = "newsapi"
query = "kollywood OR \"tamil cinema\" OR \"tamil film\" OR rajinikanth OR vijay OR anirudh"
language = "en"

[[source]]
name = "GNews · Tamil Nadu"
type = "gnews"
query = "\"Tamil Nadu\" OR Chennai OR Jaffna"
language = "en"

